<h2>empasize</h2>
<p>em tag is used to emphasize text. Browsers usually display it in italic.</p>
<p><b>Example</b></p>
<p>Lorem ipsum dolor sit amet, consectetur adipisicing elit. Dolor ipsam libero laborum, <br>
     commodi neque ab <em>quibusdam veniam consectetur</em> voluptatibus dignissimos.</p>
