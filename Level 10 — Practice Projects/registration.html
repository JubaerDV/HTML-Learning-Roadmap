<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Registration Form</title>

</head>

<body>

    <!-- ================================= -->
    <!-- REGISTRATION FORM -->
    <!-- ================================= -->

    <h1>Registration Form</h1>


    <form>

        <!-- Name -->

        <label for="name">
            Full Name:
        </label>

        <br>

        <input
            type="text"
            id="name"
            name="name"
            placeholder="Enter your full name"
        >

        <br><br>


        <!-- Email -->

        <label for="email">
            Email:
        </label>

        <br>

        <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter your email"
        >

        <br><br>


        <!-- Password -->

        <label for="password">
            Password:
        </label>

        <br>

        <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter your password"
        >

        <br><br>


        <!-- Gender / Radio Button -->

        <p>Gender:</p>

        <input
            type="radio"
            id="male"
            name="gender"
        >

        <label for="male">
            Male
        </label>


        <input
            type="radio"
            id="female"
            name="gender"
        >

        <label for="female">
            Female
        </label>


        <br><br>


        <!-- Skills / Checkbox -->

        <p>Select your skills:</p>

        <input
            type="checkbox"
            id="html"
            name="skills"
        >

        <label for="html">
            HTML
        </label>


        <input
            type="checkbox"
            id="css"
            name="skills"
        >

        <label for="css">
            CSS
        </label>


        <input
            type="checkbox"
            id="javascript"
            name="skills"
        >

        <label for="javascript">
            JavaScript
        </label>


        <br><br>


        <!-- Country -->

        <label for="country">
            Country:
        </label>

        <br>

        <select
            id="country"
            name="country"
        >

            <option>
                Bangladesh
            </option>

            <option>
                India
            </option>

            <option>
                Japan
            </option>

        </select>


        <br><br>


        <!-- Message -->

        <label for="message">
            About You:
        </label>

        <br>

        <textarea
            id="message"
            name="message"
            rows="5"
            cols="30"
            placeholder="Write something about yourself"
        ></textarea>


        <br><br>


        <!-- Submit Button -->

        <button type="submit">
            Register
        </button>

    </form>

</body>

</html>
