<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Product Page</title>

</head>

<body>

    <!-- ================================= -->
    <!-- PRODUCT PAGE -->
    <!-- ================================= -->

    <main>

        <article>

            <!-- Product Name -->

            <h1>Wireless Headphones</h1>


            <!-- Product Image -->

            <img
                src="headphone.jpg"
                alt="Wireless headphones"
                width="300"
            >


            <!-- Product Description -->

            <h2>Description</h2>

            <p>
                High-quality wireless headphones
                with comfortable design and clear sound.
            </p>


            <!-- Product Price -->

            <h2>Price</h2>

            <p>
                $50
            </p>


            <!-- Product Features -->

            <h2>Features</h2>

            <ul>

                <li>Wireless connection</li>

                <li>Long battery life</li>

                <li>Comfortable design</li>

            </ul>


            <!-- Buy Button -->

            <button type="button">
                Buy Now
            </button>

        </article>

    </main>

</body>

</html>
