<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Image Gallery</title>

</head>

<body>

    <!-- ================================= -->
    <!-- IMAGE GALLERY -->
    <!-- ================================= -->

    <header>

        <h1>My Image Gallery</h1>

        <p>Welcome to my photo gallery</p>

    </header>


    <main>

        <!-- Image 1 -->

        <figure>

            <img
                src="image1.jpg"
                alt="Beautiful nature"
                width="300"
            >

            <figcaption>
                Beautiful Nature
            </figcaption>

        </figure>


        <!-- Image 2 -->

        <figure>

            <img
                src="image2.jpg"
                alt="Beautiful mountain"
                width="300"
            >

            <figcaption>
                Beautiful Mountain
            </figcaption>

        </figure>


        <!-- Image 3 -->

        <figure>

            <img
                src="image3.jpg"
                alt="Beautiful sunset"
                width="300"
            >

            <figcaption>
                Beautiful Sunset
            </figcaption>

        </figure>

    </main>


    <footer>

        <p>
            © 2026 My Gallery
        </p>

    </footer>

</body>

</html>
