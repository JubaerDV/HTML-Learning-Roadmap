<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <title>HTML Comments</title>
</head>

<body>

    <!--
        এই comment browser-এর webpage-এ দেখা যাবে না।

        বাংলা:
        Developer নিজের code বুঝতে বা অন্য developer-কে
        বোঝানোর জন্য comment ব্যবহার করতে পারে।
    -->

    <h1>My Website</h1>

    <!-- This is a paragraph -->

    <p>
        I am learning HTML.
    </p>

    <!--
        নিচের heading-টি এখন browser-এ দেখাবে না
        কারণ এটি comment-এর ভিতরে আছে।

        <h2>This will not appear</h2>
    -->

</body>

</html>
