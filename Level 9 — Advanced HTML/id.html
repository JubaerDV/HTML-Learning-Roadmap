<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <title>ID</title>
</head>

<body>

    <!-- ================================= -->
    <!-- ID ATTRIBUTE -->
    <!-- ================================= -->

    <!--
        id="main-title"

        এই heading-এর একটি unique ID হলো main-title।
    -->

    <h1 id="main-title">
        Welcome to My Website
    </h1>


    <!--
        আরেকটি element-এর unique ID।
    -->

    <p id="description">
        I am learning HTML.
    </p>

</body>

</html>
