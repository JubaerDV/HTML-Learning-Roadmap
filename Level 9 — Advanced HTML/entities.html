<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <title>HTML Entities</title>
</head>

<body>

    <!-- ================================= -->
    <!-- HTML ENTITIES -->
    <!-- ================================= -->

    <!--
        &lt; = <
        &gt; = >
        &amp; = &
        &copy; = ©
        &nbsp; = Non-breaking space
    -->

    <h2>HTML Entities Example</h2>

    <!-- Less than symbol -->
    <p>Less than: &lt;</p>

    <!-- Greater than symbol -->
    <p>Greater than: &gt;</p>

    <!-- Ampersand symbol -->
    <p>Ampersand: &amp;</p>

    <!-- Copyright symbol -->
    <p>Copyright: &copy; 2026</p>

    <!-- Non-breaking space -->
    <p>Hello&nbsp;World</p>

</body>

</html>
