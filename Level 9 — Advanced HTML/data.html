<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <title>Data Attribute</title>
</head>

<body>

    <!-- ================================= -->
    <!-- DATA-* ATTRIBUTE -->
    <!-- ================================= -->

    <!--
        data-user-id
        এটি একটি custom data attribute।

        এখানে user-এর ID রাখা হয়েছে।
    -->

    <p data-user-id="101">
        User: Jubayer
    </p>


    <!--
        data-product
        এখানে product-এর নাম রাখা হয়েছে।
    -->

    <div data-product="laptop">

        Laptop Product

    </div>


    <!--
        data-price
        এখানে product-এর price রাখা হয়েছে।
    -->

    <div data-price="50000">

        Price: 50000

    </div>

</body>

</html>
