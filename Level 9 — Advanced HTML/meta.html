<!DOCTYPE html>
<html lang="en">

<head>

    <!-- ================================= -->
    <!-- META TAGS -->
    <!-- ================================= -->

    <!--
        Character encoding নির্ধারণ করে।
    -->

    <meta charset="UTF-8">


    <!--
        Mobile responsive করার জন্য গুরুত্বপূর্ণ।
    -->

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >


    <!--
        Webpage-এর description।
        Search engine এই information ব্যবহার করতে পারে।
    -->

    <meta
        name="description"
        content="Learn HTML step by step for beginners."
    >


    <!--
        Webpage-এর author-এর নাম।
    -->

    <meta
        name="author"
        content="Jubayer"
    >


    <!--
        Browser tab-এ webpage-এর title দেখাবে।
    -->

    <title>Meta Tags</title>

</head>

<body>

    <h1>Learning Meta Tags</h1>

    <p>
        Meta tags are written inside the head section.
    </p>

</body>

</html>favicon.html
