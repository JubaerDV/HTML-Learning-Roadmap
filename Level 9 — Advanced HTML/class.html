<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <title>Class</title>
</head>

<body>

    <!-- ================================= -->
    <!-- CLASS ATTRIBUTE -->
    <!-- ================================= -->

    <!--
        class="text"

        এই paragraph-টি "text" class-এর অন্তর্ভুক্ত।
    -->

    <p class="text">
        This is paragraph one.
    </p>


    <!--
        একই class অন্য element-এও ব্যবহার করা যায়।
    -->

    <p class="text">
        This is paragraph two.
    </p>


    <p class="text">
        This is paragraph three.
    </p>

</body>

</html>
