<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Name Attribute</title>
</head>

<body>

    <!-- ================================= -->
    <!-- NAME ATTRIBUTE -->
    <!-- ================================= -->

    <!-- 
        name="username"

        এখানে input field-এর নাম দেওয়া হয়েছে "username"।

        বাংলা:
        User এখানে যে তথ্য লিখবে,
        সেই information-কে username নামে চিহ্নিত করা যাবে।
    -->

    <p>Username:</p>

    <input 
        type="text"
        name="username"
    >


    <!-- 
        আরেকটি input field।
        এর name হলো "email"।
    -->

    <p>Email:</p>

    <input 
        type="email"
        name="email"
    >

</body>
</html>
