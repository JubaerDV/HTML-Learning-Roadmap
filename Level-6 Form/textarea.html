<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Textarea</title>
</head>

<body>

    <!-- ================================= -->
    <!-- TEXTAREA -->
    <!-- ================================= -->

    <!-- 
        <textarea> ব্যবহার করা হয়
        multiple lines text লেখার জন্য।

        বাংলা:
        বড় message বা comment লেখার জায়গা।
    -->

    <label for="message">Message:</label>

    <br>

    <textarea
        id="message"
        rows="5"
        cols="30"
    ></textarea>

</body>
</html>
