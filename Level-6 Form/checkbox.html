<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Checkbox</title>
</head>

<body>

    <!-- ================================= -->
    <!-- CHECKBOX -->
    <!-- ================================= -->

    <!-- 
        type="checkbox"
        দিলে checkbox তৈরি হয়।

        User চাইলে একাধিক checkbox select করতে পারে।
    -->

    <input 
        type="checkbox"
        id="html"
    >

    <label for="html">
        HTML
    </label>


    <br>


    <input 
        type="checkbox"
        id="css"
    >

    <label for="css">
        CSS
    </label>


    <br>


    <input 
        type="checkbox"
        id="javascript"
    >

    <label for="javascript">
        JavaScript
    </label>

</body>
</html>
