<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Radio Button</title>
</head>

<body>

    <!-- ================================= -->
    <!-- RADIO BUTTON -->
    <!-- ================================= -->

    <!-- 
        Radio Button তৈরি করতে:

        type="radio"

        ব্যবহার করা হয়।
    -->


    <!-- Male -->

    <input 
        type="radio"
        name="gender"
        id="male"
    >

    <label for="male">
        Male
    </label>


    <!-- Female -->

    <input 
        type="radio"
        name="gender"
        id="female"
    >

    <label for="female">
        Female
    </label>


    <!-- Other -->

    <input 
        type="radio"
        name="gender"
        id="other"
    >

    <label for="other">
        Other
    </label>

</body>
</html>
