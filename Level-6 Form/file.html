<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HTML Form</title>
</head>

<body>

    <!-- ================================= -->
    <!-- HTML FORM -->
    <!-- ================================= -->

    <!-- 
        <form> element ব্যবহার করে আমরা একটি form তৈরি করি।

        বাংলা:
        <form> হলো এমন একটি container যেখানে
        user তার information দিতে পারে।
    -->

    <form>

        <!-- 
            এখানে আমরা form-এর ভিতরে
            user-এর জন্য একটি input field রাখব।
        -->

        Name:

        <input type="text">

    </form>

</body>
</html>
