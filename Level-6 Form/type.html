<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Input Type</title>
</head>

<body>

    <!-- ================================= -->
    <!-- TYPE ATTRIBUTE -->
    <!-- ================================= -->

    <!-- 
        type="text"
        সাধারণ text লেখার জন্য ব্যবহার করা হয়।
    -->
    <p>Text:</p>
    <input type="text">


    <!-- 
        type="password"
        Password লেখার জন্য ব্যবহার করা হয়।
        Password সাধারণত ●●●●●● হিসেবে দেখা যায়।
    -->
    <p>Password:</p>
    <input type="password">


    <!-- 
        type="email"
        Email address লেখার জন্য ব্যবহার করা হয়।
    -->
    <p>Email:</p>
    <input type="email">


    <!-- 
        type="number"
        Number লেখার জন্য ব্যবহার করা হয়।
    -->
    <p>Age:</p>
    <input type="number">

</body>
</html>
