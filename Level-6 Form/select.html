<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Select</title>
</head>

<body>

    <!-- ================================= -->
    <!-- SELECT -->
    <!-- ================================= -->

    <!-- 
        <select> ব্যবহার করে dropdown menu তৈরি করা হয়।
    -->

    <label for="country">Choose Country:</label>

    <br><br>

    <select id="country">

        <!-- Dropdown-এর option এখানে থাকবে -->

        <option>Bangladesh</option>
        <option>India</option>
        <option>Pakistan</option>
        <option>Japan</option>

    </select>

</body>
</html>
