<h3>Ordered List</h3>
<p>The <ol> tag creates an ordered list. The items are displayed in a specific order, usually with numbers.</p>
    <p><ol> ব্যবহার করে Ordered List তৈরি করা হয়। এখানে Item-গুলো সাধারণত 1, 2, 3... এভাবে সিরিয়াল অনুযায়ী দেখা </p>
        
    <li>Wake up</li>
    <li>Brush my teeth</li>
    <li>Have breakfast</li>
</ol>
