<h2>Anchor Tag

English:</h2>
<p>The  a tag is used to create a hyperlink. It allows <br>
     users to move from one webpage to another webpage or another location.</p>
     <p><a> Tag ব্যবহার করে ওয়েবপেজে Link তৈরি করা হয়। কোনো Link-এ Click করলে অন্য Website, অন্য Page বা অন্য Location-এ যাওয়া যায়।</p>
