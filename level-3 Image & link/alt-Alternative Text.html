<h3>Alternative Text</h3>
<p>alt provides alternative text that describes the image. It is useful when the image cannot be displayed and also helps accessibility.</p>
<p>alt দিয়ে Image-এর বর্ণনা দেওয়া হয়। কোনো কারণে Image Load না হলে এই Text দেখা যেতে পারে। Screen reader-এর জন্যও এটি গুরুত্বপূর্ণ।</p>
