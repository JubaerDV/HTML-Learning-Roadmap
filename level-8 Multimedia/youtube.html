<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>YouTube Embed</title>
</head>

<body>

    <!-- ================================= -->
    <!-- YOUTUBE EMBED -->
    <!-- ================================= -->

    <!--
        YouTube video webpage-এর ভিতরে
        দেখানোর জন্য <iframe> ব্যবহার করা হয়।

        এখানে:
        width = video-এর width
        height = video-এর height

        allowfullscreen:
        User চাইলে video fullscreen করতে পারবে।
    -->

    <iframe
        width="560"
        height="315"
        src="https://www.youtube.com/embed/VIDEO_ID"
        title="YouTube video player"
        allowfullscreen>
    </iframe>

</body>

</html>
