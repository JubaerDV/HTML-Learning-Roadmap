<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Iframe</title>
</head>

<body>

    <!-- ================================= -->
    <!-- IFRAME -->
    <!-- ================================= -->

    <!--
        <iframe> ব্যবহার করে
        অন্য webpage/content আমাদের webpage-এর
        ভিতরে দেখানো যায়।

        width:
        iframe-এর প্রস্থ নির্ধারণ করে।

        height:
        iframe-এর উচ্চতা নির্ধারণ করে।
    -->

    <iframe
        src="https://www.example.com"
        width="600"
        height="400"
    >
    </iframe>

</body>

</html>
