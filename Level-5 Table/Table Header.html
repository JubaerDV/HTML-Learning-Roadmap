<h3>Table Header</h3>
<p>stands for Table Header. It defines a header cell in a table.</p>
<p>এর পূর্ণরূপ Table Header।

এটি Table-এর Heading/Header Cell তৈরি করে।</p>
<p>Browser সাধারণত <th>-এর লেখা Bold এবং Centered করে দেখায়।</p>
    <table>

    <tr>
        <th>Name</th>
        <th>Age</th>
        <th>Country</th>
    </tr>

</table>
