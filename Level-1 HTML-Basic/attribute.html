<h2>5️⃣ Attributes কী?</h2>

<p>Attribute কোনো HTML Element সম্পর্কে অতিরিক্ত তথ্য দেয়</p>
<p>Attribute সাধারণত Opening Tag-এর ভিতরে লেখা হয়।</p>
